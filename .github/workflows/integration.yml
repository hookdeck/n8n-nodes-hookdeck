# Live tests against the Hookdeck API.
#
# The unit suite drives the nodes against a stub, so it can prove what a node
# sends but never what Hookdeck does with it. These suites settle that against
# the real API, running the nodes' own provisioning and delivery handling.
#
# Suites needing a CLI skip here rather than failing: the delivery suite wants
# the Hookdeck CLI and the Stripe suite wants an authenticated Stripe CLI,
# neither of which this runner installs. What remains is everything reachable
# with an API key alone.
#
# Requires a HOOKDECK_EG_API_KEY repository secret holding a project API key
# (Project Settings → Secrets). Without it the job is skipped rather than
# failed, so pull requests from forks — which cannot read secrets — stay green.
#
# The suite creates and deletes real sources, destinations and connections.
# Point the secret at a project used for nothing else.
name: Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest

    # Fork pull requests get no secrets, so the job would fail for a reason the
    # contributor cannot fix. Skipping keeps the signal honest.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run live tests
        run: 'npm run test:live'
        env:
          HOOKDECK_EG_API_KEY: ${{ secrets.HOOKDECK_EG_API_KEY }}
