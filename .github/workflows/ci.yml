name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      # The same rule set n8n runs when reviewing a package for verification.
      # Run it on every change so a verification blocker surfaces here rather
      # than weeks into the review queue.
      - name: Run n8n verification scan
        run: 'npm run scan'

      # Unit only. The integration suite needs a Hookdeck API key and is run by
      # the Integration workflow, which has access to the secret.
      - name: Run tests
        run: 'node --test "test/unit.test.mjs"'
