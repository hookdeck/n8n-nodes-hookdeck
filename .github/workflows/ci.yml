name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      # An invalid workflow file does not fail loudly — GitHub refuses to
      # validate it and simply never runs it, so a broken publish.yml looks
      # exactly like a release that published nothing. That happened: a
      # step-level `if: ${{ secrets.NPM_TOKEN != '' }}` is not a valid context
      # there and took the whole file out. Checked here because the publish
      # workflow, by definition, cannot check itself.
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      # The same rule set n8n runs when reviewing a package for verification.
      # Run it on every change so a verification blocker surfaces here rather
      # than weeks into the review queue.
      - name: Run n8n verification scan
        run: 'npm run scan'

      # Loads the built package the way n8n does. Unit tests import dist/** by
      # path, so they cannot catch a package n8n refuses to load at all.
      - name: Verify the package loads
        run: 'node scripts/verify-package-load.mjs'

      # Unit only. The integration suite needs a Hookdeck API key and is run by
      # the Integration workflow, which has access to the secret.
      - name: Run tests
        run: 'node --test "test/unit.test.mjs"'
