# Watch for Hookdeck adding or changing Event Gateway source types.
#
# `nodes/Hookdeck/SourceTypes.ts` is generated from Hookdeck's live OpenAPI
# schema. Without this, a newly supported platform simply never appears in the
# node's Source Type dropdown, and nothing anywhere says so.
#
# Deliberately not part of the main CI job: the spec is a live third-party
# document, so a Hookdeck release would turn every unrelated pull request red
# for a reason the author cannot fix. A failure here notifies the repository
# owner instead; the fix is `npm run generate:source-types` and a commit.
name: Source type drift

on:
  schedule:
    # Mondays at 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Check SourceTypes.ts against the Hookdeck OpenAPI spec
        run: 'npm run check:source-types'
