# Publishes to npm when a GitHub Release is published.
#
# The release is the source of truth: creating it makes the tag, carries the
# notes people actually read, and starts this workflow. Nothing publishes from
# a bare tag push, and nothing publishes from a laptop.
#
# See README § Releasing for the steps, and skills/n8n-nodes-hookdeck-release
# for the agent-assisted version — choosing the version, drafting the notes,
# and the gates that have to pass first.
#
# ─── WHY A RELEASE AND NOT A TAG ───────────────────────────────────────────────
#
# n8n requires community nodes to be published from GitHub Actions with an npm
# provenance statement (mandatory since 1 May 2026). Provenance ties the package
# to this repository, this workflow and this commit, so it has to run here.
#
# Driving it from a published Release rather than a tag push means the version,
# the notes and the artifact are decided in one place, and a draft release can be
# prepared and reviewed before anything reaches npm.
#
# ─── PROVENANCE IS NOT TRUSTED PUBLISHING ──────────────────────────────────────
#
# Two separate things, easily conflated:
#
#   Provenance         the signed attestation linking the package to this repo,
#                      workflow and commit. Needs `id-token: write` and a
#                      supported CI. Works with either auth method below.
#                      This is what n8n requires.
#
#   Trusted publishing publishing with a short-lived OIDC token instead of a
#                      long-lived npm token. Nice to have; not required by n8n.
#
# ─── SETUP ─────────────────────────────────────────────────────────────────────
#
# Trusted publishers are configured on an *existing* package's settings page, so
# a package that has never been published cannot use OIDC for its first release.
#
#   First release:  set an NPM_TOKEN repository secret — a granular token scoped
#                   to @hookdeck with read and write access. Provenance still
#                   applies, so this satisfies n8n.
#
#   After that:     on npmjs.com open the package → Settings → "Trusted
#                   Publishers" → "Add a publisher" → GitHub Actions, with
#                   owner `hookdeck`, repository `n8n-nodes-hookdeck`, workflow
#                   `publish.yml`, environment blank. Then delete the NPM_TOKEN
#                   secret: the step below is skipped when it is absent and npm
#                   falls back to OIDC on its own.
#
# OIDC needs npm >= 11.5.1 on Node >= 22.14, which `lts/*` satisfies. The guard
# below fails loudly rather than silently falling back if that ever stops being
# true.
name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for the npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          # The release tag, not the default branch: publish exactly what was
          # released, even if main has moved on since.
          ref: ${{ github.event.release.tag_name }}

      # `registry-url` is deliberately not set. It makes setup-node write
      # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and with no token that is an
      # empty credential — which npm prefers over OIDC, so trusted publishing
      # silently fails to engage. The default registry is npmjs anyway.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      # The tag is the version. package.json is not bumped in a commit, so there
      # is no release commit to land and no window where the two disagree.
      # `--allow-same-version` keeps a first release working when package.json
      # already carries the number.
      - name: Set the version from the release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing $VERSION"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      # The same checks CI runs, repeated here because this is the last point at
      # which a bad package can be stopped. `scan` is n8n's own verification rule
      # set: failing it here means it would fail review too.
      - name: Verify before publishing
        run: |
          npm run lint
          npm run scan
          npm run build
          node scripts/verify-package-load.mjs
          node --test "test/unit.test.mjs"

      # A pre-release tag (0.2.0-beta.1) publishes under `beta`, so `npm install
      # @hookdeck/n8n-nodes-hookdeck` keeps resolving to the last stable version.
      - name: Choose the npm dist-tag
        id: disttag
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check npm supports trusted publishing
        run: |
          npx --yes semver -r '>=11.5.1' "$(npm -v)" >/dev/null \
            || { echo "npm $(npm -v) is too old for OIDC publishing (needs >=11.5.1)"; exit 1; }

      # Skipped entirely when the secret is absent, which leaves npm to use OIDC.
      # Setting an empty token would take precedence over OIDC and fail.
      - name: Authenticate with a token, if one is configured
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm config set //registry.npmjs.org/:_authToken "${{ secrets.NPM_TOKEN }}"

      - name: Publish
        run: npm publish --provenance --access public --tag "${{ steps.disttag.outputs.tag }}"
